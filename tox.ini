[tox]
minversion = 4.9.0
envlist =
    lint
    build
    tests

lint_folders =
    "{toxinidir}/src" \
    "{toxinidir}/tests" \
    "{toxinidir}/developer"

[testenv]
passenv = *

[testenv:.pkg]

[testenv:tests]
description = Run the default test suite (no LLM, no PostgreSQL, no slow tests).
setenv =
    PYTHONUNBUFFERED=yes
usedevelop = true
deps = -r tests/requirements.txt
commands =
    pytest {posargs}

[testenv:tests-postgres]
description = Run the database tests against PostgreSQL (CRA_TEST_POSTGRES_URL).
setenv = {[testenv:tests]setenv}
usedevelop = true
extras = postgres
deps = -r tests/requirements.txt
commands =
    pytest -m postgres {posargs}

[testenv:tests-llm]
description = Run the tests that call a real LLM endpoint (CRA_LLM_API_KEY, CRA_LLM_BASE_URL, CRA_LLM_MODEL).
setenv = {[testenv:tests]setenv}
usedevelop = true
deps = -r tests/requirements.txt
commands =
    pytest -m llm {posargs}

# eslint, prettier and stylelint run on a Node that nodeenv puts into the tox
# env, so linting needs nothing beyond Python; .node-version pins it.
[node]
deps = nodeenv
commands_pre =
    bash -c 'test -x "{envbindir}/node" || nodeenv --python-virtualenv --prebuilt --node="$(cat .node-version)"'
    npm ci --no-audit --no-fund --loglevel=error
allowlist_externals =
    bash
    npm

[testenv:lint]
description = Run linters and type checks on Python, JS, CSS, templates, Dockerfile, shell and workflows.
package = skip
deps =
    ruff
    mypy
    djlint
    yamllint
    shellcheck-py
    actionlint-py
    hadolint-bin
    {[node]deps}
allowlist_externals = {[node]allowlist_externals}
commands_pre = {[node]commands_pre}
commands =
    ruff format --diff {[tox]lint_folders}
    ruff check {[tox]lint_folders}
    mypy {[tox]lint_folders}
    npm run --silent lint
    djlint --lint src/cra/app/web
    yamllint --strict .
    bash -c "git ls-files -z '*.sh' | xargs -0 shellcheck"
    actionlint
    hadolint Dockerfile

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps =
    ruff
    {[node]deps}
allowlist_externals = {[node]allowlist_externals}
commands_pre = {[node]commands_pre}
# Templates are linted, not formatted: prettier cannot parse Jinja, and
# djlint's formatter misindents everything after an inline element that
# holds block content.
commands =
    ruff format {[tox]lint_folders}
    ruff check --fix-only {[tox]lint_folders} {posargs}
    npm run --silent format

[testenv:build]
description = Assert package build integrity for {platform} with {basepython}.
usedevelop = true
deps =
    build
    check-manifest
    twine
allowlist_externals = bash
commands_pre = python {toxinidir}/developer/clean_dist_check.py
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest {toxinidir}
    bash -c "python -m pip install --force-reinstall dist/cluster_research_assist-*.tar.gz"
    bash -c "python -m pip install --force-reinstall dist/cluster_research_assist-*.whl"
